# PostgreSQL cho máy dev: docker compose up -d db
# Mật khẩu dưới đây chỉ dùng trên máy dev, không dùng khi deploy.
services:
  db:
    image: postgres:16.4
    container_name: evidencechain-db
    environment:
      POSTGRES_DB: evidencechain
      POSTGRES_USER: evidence_owner        # chủ sở hữu bảng, chỉ dùng để chạy migration
      POSTGRES_PASSWORD: owner_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/postgres-init:/docker-entrypoint-initdb.d:ro   # tạo role evidence_app lần đầu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence_owner -d evidencechain"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
