# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: evidencechain
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SEPOLIA_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      # Khóa ví test: nhập tay trên dashboard Render, KHÔNG ghi vào file này
      - key: PRIVATE_KEY
        sync: false
